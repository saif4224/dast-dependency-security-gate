name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: pytest --cov=appsec_gate --cov-report=term-missing

      - name: Run demo pipeline end-to-end (report-only)
        run: python -m appsec_gate.cli --demo --report-only --output-dir ci_output

      - name: Gate must block the deliberately-vulnerable demo target
        run: |
          set +e
          python -m appsec_gate.cli --demo --output-dir gate_check
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected the gate to exit 1 (block) against the known-vulnerable demo target, got $code"
            exit 1
          fi
          echo "Gate correctly blocked the build (exit code 1) - working as intended."

      - name: Upload demo report + visuals
        uses: actions/upload-artifact@v4
        with:
          name: demo-output-py${{ matrix.python-version }}
          path: ci_output/

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dast-gate:ci .
      - name: Smoke test container (report-only)
        run: docker run --rm -v ${{ github.workspace }}/ci_output:/app/output dast-gate:ci --demo --report-only
