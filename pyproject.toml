[project]
name = "appsec-gate"
version = "0.1.0"
description = "DAST scanner + OSV.dev dependency (SCA) checker + CI/CD security gate"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["appsec_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
